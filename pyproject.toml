[build-system]
requires = ["setuptools~=77.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "abedome-frontend"
version      = "2026.8.5.dev4"
license      = "Apache-2.0"
license-files = ["LICENSE*"]
description  = "The ABEDOME frontend"
readme       = "README.md"
authors      = [{name = "ABEDOME Contributors"}]
requires-python = ">=3.14.0"

[project.urls]
"Homepage" = "https://github.com/Mauro2020/abedome-frontend"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hass_frontend*"]
